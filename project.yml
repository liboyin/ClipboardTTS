name: ClipboardTTSApp
options:
  bundleIdPrefix: com.clipboardtts
targets:
  ClipboardTTSApp:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources: [Sources]
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          if command -v swiftlint >/dev/null; then
            swiftlint --strict
          else
            echo "warning: SwiftLint not installed (brew install swiftlint); skipping static analysis"
          fi
    info:
      path: Sources/Info.plist
      properties:
        LSUIElement: true
        NSServices:
          - NSMenuItem:
              default: "Speak Selected Text with Clipboard TTS"
            NSMessage: "handleServices"
            NSPortName: "ClipboardTTSApp"
            NSSendTypes:
              - "public.plain-text"

  ClipboardTTSAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources: [Tests]
    dependencies:
      - target: ClipboardTTSApp
    settings:
      GENERATE_INFOPLIST_FILE: YES
