name: ClipboardTTSApp
options:
  bundleIdPrefix: com.clipboardtts
targets:
  ClipboardTTSApp:
    type: application
    productName: ClipboardTTS
    platform: macOS
    deploymentTarget: "14.0"
    # Swift 5 language mode with complete concurrency checking, so new isolation warnings stay
    # visible in every app build. The product is ClipboardTTS.app while the target, scheme, Swift
    # module, and bundle identifier keep the ClipboardTTSApp name, so `@testable import`, saved
    # preferences, and Keychain items are unaffected. `productName` names the product reference and
    # the test host path; PRODUCT_NAME names the built bundle and executable.
    settings:
      PRODUCT_NAME: ClipboardTTS
      PRODUCT_MODULE_NAME: ClipboardTTSApp
      SWIFT_STRICT_CONCURRENCY: complete
      # Sources/Assets.xcassets/AppIcon.appiconset is derived from assets/light_1800.png: the
      # artwork is cropped to its visible bounds, scaled to 993 px tall (enlarged by request from
      # Apple's 824 px macOS icon grid, so it shows larger on macOS 26's grey tile) and centred on
      # a 1024 px canvas, then downsampled for each size.
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - Sources
      - path: LICENSE
        buildPhase: resources
    # Every build is the strict lint gate, for Sources and Tests alike, so a build without SwiftLint
    # fails rather than skipping it. A build started from the Xcode app does not inherit a shell's
    # PATH, so Homebrew's two install locations are searched as well.
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          if ! command -v swiftlint >/dev/null; then
            echo "error: SwiftLint is not installed (brew install swiftlint); every build runs it as the strict lint gate"
            exit 1
          fi
          swiftlint --strict
    info:
      path: Sources/Info.plist
      properties:
        CFBundleShortVersionString: "1.0.1"
        LSUIElement: true
        NSServices:
          - NSMenuItem:
              default: "Speak Selected Text with Clipboard TTS"
            NSMessage: "handleServices"
            NSPortName: "ClipboardTTS"
            NSSendTypes:
              - "public.plain-text"

  ClipboardTTSAppTests:
    type: bundle.unit-test
    platform: macOS
    # Matches ClipboardTTSApp, so every gate runs on the app's own minimum. Xcode 27.2's XCTest
    # libraries also require macOS 14.
    deploymentTarget: "14.0"
    sources: [Tests]
    dependencies:
      - target: ClipboardTTSApp
    # The same complete concurrency checking the app target is held to, so `./check-coverage.sh`
    # compiles the test bundle under it on every run rather than leaving the check to a command
    # someone has to remember.
    settings:
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_STRICT_CONCURRENCY: complete
