name: ClipboardTTSApp
options:
  bundleIdPrefix: com.clipboardtts
targets:
  ClipboardTTSApp:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        LSUIElement: true
        NSServices:
          - NSMenuItem:
              default: "Speak Selected Text"
            NSMessage: "handleServices"
            NSPortName: "ClipboardTTSApp"
            NSSendTypes:
              - "public.plain-text"

  ClipboardTTSAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources: [Tests]
    dependencies:
      - target: ClipboardTTSApp
    settings:
      GENERATE_INFOPLIST_FILE: YES
