name: AdvancedTTSApp
options:
  bundleIdPrefix: com.advancedtts
targets:
  AdvancedTTSApp:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        LSUIElement: true
        NSServices:
          - NSMenuItem:
              default: "Speak Selected Text"
            NSMessage: "handleServices"
            NSPortName: "AdvancedTTSApp"
            NSSendTypes:
              - "public.plain-text"

  AdvancedTTSAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources: [Tests]
    dependencies:
      - target: AdvancedTTSApp
