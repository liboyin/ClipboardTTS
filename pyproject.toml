[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "macos-tts-service"
version = "0.1.0"
description = "macOS Menu Bar TTS using OpenAI"
dependencies = [
    "portaudio",
    "rumps",
    "sounddevice",
    "soundfile",
    "pyobjc-framework-Cocoa",
    "pyobjc-framework-AppKit"
]
requires-python = ">=3.13"

[project.scripts]
tts-daemon = "macos_tts.daemon:main"
tts-client = "macos_tts.client:main"
tts-menubar = "macos_tts.menubar:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["macos_tts"]
